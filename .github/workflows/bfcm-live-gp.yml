name: BFCM live GP

# Calibration run while the job is being built: works out which NetSuite filter reproduces
# the sheet's GP Created column. Prints names, counts and percentage errors only.

on:
  push:
    branches: [claude/happy-einstein-wvx19r]
    paths: ["_pipelines/bfcm-live-gp/**", ".github/workflows/bfcm-live-gp.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Australia/Brisbane
      NS_ACCOUNT_ID: ${{ secrets.NS_ACCOUNT_ID }}
      NS_CONSUMER_KEY: ${{ secrets.NS_CONSUMER_KEY }}
      NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
      NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
      NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calibrate against the sheet
        working-directory: _pipelines/bfcm-live-gp
        run: python explore.py
