name: Dead stock tracker

# Daily refresh of the dead stock tiles on the GAF master dashboard (OPSP tab,
# Trend Detail). Reads the "Deadstock Tracker - FY27" sheet's LOCATION SUMMARY tab
# via its published CSV (no NetSuite or Google auth) and commits
# deadstock-tracker.json with the workflow's own GITHUB_TOKEN.
# Pipeline code: _pipelines/deadstock-tracker/update.py.
#
# Never touches _src/gaf-master-dashboard/data/opsp-finals.json — Q1 FY27's
# "Reduce GC Dead Stock" result stays frozen there.
#
# 20:47 UTC = 6:17am ACST, every day. (TZ keeps the run's dates on Adelaide time.)

on:
  schedule:
    - cron: "47 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: deadstock-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Australia/Adelaide
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the Location Summary feed
        working-directory: _pipelines/deadstock-tracker
        run: python update.py

      - name: Commit if the figures changed
        run: |
          set -euo pipefail
          cp _pipelines/deadstock-tracker/deadstock-tracker.json gaf-master-dashboard/deadstock-tracker.json
          cp _pipelines/deadstock-tracker/deadstock-tracker.json _src/gaf-master-dashboard/public/deadstock-tracker.json
          git config user.name "deadstock-tracker-bot"
          git config user.email "deadstock-tracker@users.noreply.github.com"
          git add gaf-master-dashboard/deadstock-tracker.json _src/gaf-master-dashboard/public/deadstock-tracker.json
          if git diff --cached --quiet; then
            echo "No change — nothing to publish."
            exit 0
          fi
          GC=$(python -c "import json; print(json.load(open('gaf-master-dashboard/deadstock-tracker.json'))['gc'][-1])")
          git commit -m "Dead stock tracker: GC \$${GC} (auto-update)"
          git push origin HEAD || { git pull --rebase origin main && git push origin HEAD; }

      # Pushes made with GITHUB_TOKEN do not reliably trigger the Pages build.
      - name: Request a Pages build
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /dev/null -w "Pages build request: HTTP %{http_code}\n" || true
