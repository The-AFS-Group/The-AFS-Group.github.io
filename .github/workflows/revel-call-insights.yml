name: Revel call insights

# Nightly refresh of the Revel call insights dashboard (revel-call-insights/).
# Downloads the published "Revel call analysis" sheet (Aircall calls with their
# AI analysis), builds revel-call-insights/data.js and commits it with the
# workflow's own GITHUB_TOKEN.
# Pipeline code and notes: _pipelines/revel-call-insights/README.md.
#
# This repo is public, so its Actions logs are public: build.py only prints
# counts and status codes, never call contents.
#
# 19:43 UTC = 5:43am AEST (Brisbane has no daylight saving).

on:
  schedule:
    - cron: "43 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: revel-call-insights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Australia/Brisbane
      REVEL_CALLS_CSV_URL: ${{ secrets.REVEL_CALLS_CSV_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the sheet and build data.js
        working-directory: _pipelines/revel-call-insights
        run: python build.py

      - name: Commit if the data changed
        run: |
          set -euo pipefail
          git config user.name "revel-call-insights-bot"
          git config user.email "revel-call-insights@users.noreply.github.com"
          git add revel-call-insights/data.js
          if git diff --cached --quiet; then
            echo "No change, nothing to publish."
            exit 0
          fi
          SUMMARY=$(python -c "import json; t=open('revel-call-insights/data.js').read(); d=json.loads(t[t.index('{'):t.rindex('}')+1]); print(f\"{len(d['calls'])} calls to {d['calls'][-1]['d']}\")")
          git commit -m "Revel call insights: ${SUMMARY} (auto-update)"
          git push origin HEAD || { git pull --rebase origin main && git push origin HEAD; }

      # Pushes made with GITHUB_TOKEN do not reliably trigger the Pages build.
      - name: Request a Pages build
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /dev/null -w "Pages build request: HTTP %{http_code}\n" || true
