name: Warehouse planner

# Nightly refresh of the Warehouse Planner tab on the GAF master dashboard.
# Reads NetSuite directly through the REST query service (SuiteQL), signed in
# with a token for a read-only integration role, builds warehouse-planner.json
# and commits it with the workflow's own GITHUB_TOKEN.
# Pipeline code and setup steps: _pipelines/warehouse-planner/README.md.
#
# Until the five NetSuite secrets below exist, each run skips cleanly and the
# tab keeps showing its current data.
#   NS_ACCOUNT_ID, NS_CONSUMER_KEY, NS_CONSUMER_SECRET, NS_TOKEN_ID, NS_TOKEN_SECRET
#
# This repo is public, so its Actions logs are public: build.py only prints
# counts and status codes, never record contents.
#
# 16:13 UTC = 2:13am AEST (Gold Coast has no daylight saving).

on:
  schedule:
    - cron: "13 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: warehouse-planner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Australia/Brisbane
      NS_ACCOUNT_ID: ${{ secrets.NS_ACCOUNT_ID }}
      NS_CONSUMER_KEY: ${{ secrets.NS_CONSUMER_KEY }}
      NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
      NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
      NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
    steps:
      - name: Check the NetSuite secrets are configured
        id: feeds
        run: |
          if [ -z "$NS_ACCOUNT_ID" ] || [ -z "$NS_CONSUMER_KEY" ] || [ -z "$NS_CONSUMER_SECRET" ] || [ -z "$NS_TOKEN_ID" ] || [ -z "$NS_TOKEN_SECRET" ]; then
            echo "::notice::NetSuite secrets for the warehouse planner are not configured yet. Skipping; the tab keeps its current data."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.feeds.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.feeds.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Read NetSuite and build warehouse-planner.json
        if: steps.feeds.outputs.ready == 'true'
        working-directory: _pipelines/warehouse-planner
        run: python build.py

      - name: Commit if the data changed
        if: steps.feeds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cp _pipelines/warehouse-planner/warehouse-planner.json gaf-master-dashboard/warehouse-planner.json
          cp _pipelines/warehouse-planner/warehouse-planner.json _src/gaf-master-dashboard/public/warehouse-planner.json
          git config user.name "warehouse-planner-bot"
          git config user.email "warehouse-planner@users.noreply.github.com"
          git add gaf-master-dashboard/warehouse-planner.json _src/gaf-master-dashboard/public/warehouse-planner.json _pipelines/warehouse-planner/warehouse-planner.json
          if git diff --cached --quiet; then
            echo "No change, nothing to publish."
            exit 0
          fi
          SUMMARY=$(python -c "import json; d=json.load(open('gaf-master-dashboard/warehouse-planner.json')); print(f\"{len(d['containers'])} containers, {len(d['orders'])} large orders\")")
          git commit -m "Warehouse planner: ${SUMMARY} (auto-update)"
          git push origin HEAD || { git pull --rebase origin main && git push origin HEAD; }

      # Pushes made with GITHUB_TOKEN do not reliably trigger the Pages build.
      - name: Request a Pages build
        if: steps.feeds.outputs.ready == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /dev/null -w "Pages build request: HTTP %{http_code}\n" || true
