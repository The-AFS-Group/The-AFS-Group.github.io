name: Open seed pull requests

# Run once by scripts/bootstrap.sh. Opens one PR per seed/<category> branch so the
# PR author is the bot, not Tristan or Ben (GitHub doesn't let you approve your own PR).

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: One PR per seed branch
        run: |
          set -euo pipefail
          for B in $(git ls-remote --heads origin 'seed/*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            CAT=${B#seed/}
            if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$B" --state all --json number --jq '.[0].number // empty')" ]; then
              echo "$B already has a PR"; continue
            fi
            TITLE=$(head -n1 "seed/$CAT.md" | sed 's/^## //')
            URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$B" --title "$TITLE" --body-file "seed/$CAT.md" --label seed,brain-draft)
            NUM=${URL##*/}
            gh workflow run brain-checks.yml --repo "$GITHUB_REPOSITORY" -f pr="$NUM"
            gh workflow run approvals.yml --repo "$GITHUB_REPOSITORY" -f pr="$NUM"
            echo "Opened $URL"
          done
