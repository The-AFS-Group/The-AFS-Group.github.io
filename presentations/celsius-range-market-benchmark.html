/* ===================== ICONS ===================== */
const I = p => (
  <svg xmlns="http://www.w3.org/2000/svg" width={p.size||18} height={p.size||18} viewBox="0 0 24 24"

const ChevR  = p => <I {...p} d="M9 18l6-6-6-6" />;

const Warn   = p => <I {...p} d={["M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z","M12 9v4","M12 17h.01"]} />;

/* ===================== PRIMITIVES ===================== */
const Slide = ({ children, num, total, noPad }) => {
  const th = useTheme();
  return (
    <div className={`w-full h-full ${th.bg} flex flex-col ${noPad ? '' : 'px-16 py-11'} relative overflow-hidden`}>

        <span className={`text-[11px] font-heading tracking-[.3em] uppercase ${th.footerText}`}>
          {String(num).padStart(2,'0')} / {String(total).padStart(2,'0')}

      </div>
    </div>
  );
};

const SectionTitle = ({ pre, title, sub }) => {
  const th = useTheme();
  return (
    <div className="mb-5 shrink-0">

      {sub && <p className={`text-[15px] font-body ${th.sub} mt-2 max-w-5xl leading-snug`}>{sub}</p>}
    </div>
  );
};

const Callout = ({ icon: Icon = Target, children }) => {
  const th = useTheme();

    <div className="bg-brand-accent/5 border border-brand-accent/20 rounded-lg p-3.5 flex items-start gap-3 shrink-0">

  );
};

};

      </div>
    </Slide>
  );
};

/* ===================== ENGINE ===================== */
const SLIDES = [TitleSlide, MethodSlide, GlanceSlide, ScorecardSlide, CatA, CatB, CatC, CatD, CatE, CatF, LiftSlide, RecsSlide, CloseSlide];

function App() {
  const [idx, setIdx]   = useState(0);
  const [key, setKey]   = useState(0);
  const [dark, setDark] = useState(false);
  const [zoom, setZoom] = useState(() => Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
  const th = dark ? themes.dark : themes.light;

  const go = useCallback((dir) => {
    setIdx(prev => { const next = prev + dir; if (next >= 0 && next < SLIDES.length) { setKey(k => k + 1); return next; } return prev; });
  }, []);
  useEffect(() => { const calc = () => setZoom(Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1)); window.addEventListener('resize', calc); return () => window.removeEventListener('resize', calc); }, []);
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'd' || e.key === 'D') setDark(v => !v);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [go]);
  useEffect(() => { document.body.style.background = th.bodyBg; }, [th.bodyBg]);

  const Cur = SLIDES[idx];
  return (
    <ThemeCtx.Provider value={th}>
      <div className="w-screen h-screen flex items-center justify-center" style={{background: th.bodyBg}}>
        <div style={{width: 1600, height: 900, transform: `scale(${zoom})`, transformOrigin: 'center'}} className="relative shadow-2xl">
          <div key={key} className="w-full h-full slide-enter"><Cur n={idx + 1} t={SLIDES.length} /></div>
        </div>
        <div className="fixed bottom-6 right-6 flex items-center gap-2 z-50">
          <button onClick={() => setDark(v => !v)} title="Toggle theme (D)" className={`w-10 h-10 rounded-lg border ${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover} flex items-center justify-center transition-colors`}>{dark ? <Sun size={18} /> : <Moon size={18} />}</button>
          <button onClick={() => go(-1)} disabled={idx === 0} title="Previous" className={`w-10 h-10 rounded-lg border flex items-center justify-center transition-colors ${idx === 0 ? th.navDisabled + ' ' + th.navBorder : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}><ChevL size={18} /></button>
          <button onClick={() => go(1)} disabled={idx === SLIDES.length - 1} title="Next" className={`w-10 h-10 rounded-lg border flex items-center justify-center transition-colors ${idx === SLIDES.length - 1 ? th.navDisabled + ' ' + th.navBorder : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}><ChevR size={18} /></button>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}
createRoot(document.getElementById('root')).render(<App />);
