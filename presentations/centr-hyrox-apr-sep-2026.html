// ===== DONUT CHART =====
const Donut = ({ data, size = 220, thickness = 28 }) => {
  const th = useTheme();
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  const total = data.reduce((s, d) => s + d.value, 0);
  let cum = 0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={th.donutTrack} strokeWidth={thickness} />
      {data.map((d, i) => {
        const pct = d.value / total;
        const offset = c * (1 - pct);
        const rotation = cum * 360;
        cum += pct;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={thickness}
          strokeDasharray={c} style={{'--circumference': c, '--dash-offset': offset}}
          className="donut-animate" strokeDashoffset={c}
          transform={`rotate(${rotation} ${size/2} ${size/2})`} />;
      })}
    </svg>
  );
};

const monthlyData = DATA.months;          // [{ month, rev, gp }]
const categories = DATA.cats;             // [{ name, rev, gp (%), color }]
const departments = DATA.depts;           // [{ name, value, gp (%), color }]  – 2nd entry (Commercial) is highlighted
const topPages = DATA.pages;              // [{ label, path, sessions, views, atc, bounceRate }]
const GA4_WINDOW = { label: '24 Jul – 21 Oct 2026', days: 90, source: 'GAF Performance Dashboard (GA4, Australian traffic)' };

// ----- derived numbers (do not edit) -----
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const totalRev = sum(monthlyData, m => m.rev);
const totalGp = sum(monthlyData, m => m.gp);
const gpPct = totalGp / totalRev * 100;
const peak = monthlyData.reduce((a, b) => (b.rev > a.rev ? b : a));
const half = Math.floor(monthlyData.length / 2);
const h1 = sum(monthlyData.slice(0, half), m => m.rev);
const h2 = sum(monthlyData.slice(half), m => m.rev);
const hoh = (h2 / h1 - 1) * 100;
const dept = n => departments.find(d => d.name.startsWith(n)) || { value: 0, gp: 0 };
const commercial = dept('Commercial');
const retail = dept('Retail');
const deptTotal = sum(departments, d => d.value);
const commPct = commercial.value / deptTotal * 100;
const retailPct = retail.value / deptTotal * 100;
const money = v => '$' + Math.round(v).toLocaleString('en-AU');
const kFmt = v => '$' + Math.round(v / 1000) + 'K';
const mFmt = v => '$' + (v / 1e6).toFixed(2) + 'M';
const pct1 = v => v.toFixed(1) + '%';
const peakComm = 107233.75; // May '26 Commercial revenue (NetSuite) – update with the peak month if the data changes
const bestCat = categories.reduce((a, b) => (b.gp > a.gp && b.rev > 50000 ? b : a));
const lowCat = categories.filter(c => c.rev > 50000).reduce((a, b) => (b.gp < a.gp ? b : a));

// ----- comparison with the same six months last year (same NetSuite method, same SKU set) -----
const PRIOR = { label: 'Apr – Sep 2025', short: "Apr '25 – Sep '25", seqLabel: 'Oct 2025 – Mar 2026' };
const priorMonths = DATA.prior.prior_months;           // [{ month, rev, gp }]
const priorRev = sum(priorMonths, m => m.rev);
const priorGp = sum(priorMonths, m => m.gp);
const priorGpPct = priorGp / priorRev * 100;
const yoyRev = (totalRev / priorRev - 1) * 100;
const yoyGp = (totalGp / priorGp - 1) * 100;
const gpMultiple = totalGp / priorGp;
const marginPts = gpPct - priorGpPct;
const curUnits = DATA.prior.cur_units_total;
const yoyUnits = (curUnits / DATA.prior.prior_units - 1) * 100;
const seqRev = DATA.prior.seq.rev, seqGp = DATA.prior.seq.gp;
const vsSeqRev = (totalRev / seqRev - 1) * 100;
const vsSeqGp = (totalGp / seqGp - 1) * 100;
const up = v => (v >= 0 ? '+' : '') + Math.round(v) + '%';
const catCompare = categories.map(c => {
  const p = DATA.prior.prior_cats[c.name] || { rev: 0, gp: 0, units: 0 };
  return { ...c, priorRev: p.rev, priorGpPct: p.rev ? p.gp / p.rev * 100 : null, change: p.rev ? (c.rev / p.rev - 1) * 100 : null };
});

// ===== APP =====
const SLIDES = [TitleSlide, PerfSlide, UpliftSlide, SalesSlide, DigitalSlide, WinsSlide, ChallengesSlide, PlansSlide, ExpSlide, SupportSlide, NotesSlide, QSlide];

function App() {
  const [idx, setIdx] = useState(0);
  const [key, setKey] = useState(0);
  const [dark, setDark] = useState(false);
  const [zoom, setZoom] = useState(() => Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
  const th = dark ? themes.dark : themes.light;

  const go = useCallback((dir) => {
    const next = idx + dir;
    if (next >= 0 && next < SLIDES.length) { setIdx(next); setKey(k => k + 1); }
  }, [idx]);

  useEffect(() => {
    const calc = () => setZoom(Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  useEffect(() => {
    const h = e => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'd' || e.key === 'D') setDark(d => !d);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [go]);

  useEffect(() => {
    document.body.style.background = th.bodyBg;
    document.body.className = th.grainClass;
  }, [dark]);

  const C = SLIDES[idx];
  return (
    <ThemeCtx.Provider value={th}>
      <div className="w-screen h-screen overflow-hidden flex items-center justify-center" style={{background: th.bodyBg}}>
        <div key={key} className="overflow-hidden slide-enter rounded-lg shrink-0" style={{width: 1600, height: 900, zoom, boxShadow: dark ? '0 0 80px rgba(0,0,0,.6)' : '0 4px 60px rgba(0,0,0,.12)'}}>
          <C n={idx + 1} t={SLIDES.length} />
          {/* Nav + theme toggle */}
          <div className="absolute bottom-6 right-8 flex gap-2 z-50">
            <button onClick={() => setDark(d => !d)} title="Toggle theme (D)"
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}>
              {dark ? <Sun size={14} /> : <Moon size={14} />}
            </button>
            <div className="w-px h-9 bg-gaf-orange/20"></div>
            <button onClick={() => go(-1)} disabled={idx===0}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===0 ? th.navDisabled : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
              <ChevL size={16} />
            </button>
            <button onClick={() => go(1)} disabled={idx===SLIDES.length-1}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===SLIDES.length-1 ? th.navDisabled : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
              <ChevR size={16} />
            </button>
          </div>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
