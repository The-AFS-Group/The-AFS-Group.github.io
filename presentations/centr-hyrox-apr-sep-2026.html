// ===== DONUT CHART =====
const Donut = ({ data, size = 220, thickness = 28 }) => {
  const th = useTheme();
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  const total = data.reduce((s, d) => s + d.value, 0);
  let cum = 0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={th.donutTrack} strokeWidth={thickness} />
      {data.map((d, i) => {
        const pct = d.value / total;
        const offset = c * (1 - pct);
        const rotation = cum * 360;
        cum += pct;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={thickness}
          strokeDasharray={c} style={{'--circumference': c, '--dash-offset': offset}}
          className="donut-animate" strokeDashoffset={c}
          transform={`rotate(${rotation} ${size/2} ${size/2})`} />;
      })}
    </svg>
  );
};

const peak = monthlyData.reduce((a, b) => (b.rev > a.rev ? b : a));

            <p className={`text-[14px] font-heading font-semibold tracking-[.2em] uppercase ${th.text}`}>{c.name}</p>
            <div className="flex items-baseline gap-3 mt-2">
              <span className="text-5xl font-heading font-black text-gaf-orange leading-none">{fy >= 1000 ? '$' + (fy / 1000).toFixed(2) + 'M' : '$' + fy + 'K'}</span>
              <span className={`text-[13px] font-body ${th.sub}`}>{TARGETS.fy} target</span>
            </div>
            <p className={`text-[13px] font-body ${th.sub} mt-1`}>{'$' + c.fy26 + 'K'} in FY26 · {c.note}</p>
            <p className={`text-[12px] font-body ${th.muted} mt-0.5`}>Q1 actual {'$' + c.q[0] + 'K'} · Q2 {c.q[1]} · Q3 {c.q[2]} · Q4 {c.q[3]}</p>
            <div className={`my-3 border-t ${th.cardBorder}`}></div>
            <div className="space-y-2 flex-1">
              {CONTENT.commercialLevers[c.name].map(itemText).map((item, j) => (
                <div key={j} className="flex items-start gap-2">
                  <div className="w-1 h-1 rounded-full bg-gaf-orange mt-1.5 shrink-0"></div>
                  <p className={`text-[15px] ${th.sub} font-body leading-snug`}>{item.text}{item.review && <Review />}</p>
                </div>
              ))}
            </div>
          </div>
          );
        })}
      </div>
      <div className={`${th.cardBg} border ${th.cardBorder} rounded-lg px-5 py-3 shrink-0 pr-32`}>
        <div className="flex items-center gap-6">
          <p className="text-[13px] font-heading tracking-[.3em] text-gaf-orange uppercase shrink-0">{CONTENT.forecastTitle}<Review /></p>
          <div className="grid grid-cols-3 gap-6 flex-1">
            {CONTENT.forecast.map((f, i) => (
              <p key={i} className={`text-[13px] font-body ${th.sub} leading-snug`}><span className={`font-heading font-semibold ${th.text}`}>{f.h}: </span>{f.b}</p>
            ))}
          </div>
        </div>
        <p className={`text-[11px] font-body ${th.muted} mt-1`}>{CONTENT.commercialNote}</p>
      </div>
    </div>
  </Slide>
  );
};

// ===== SLIDE: DELIVERY PLAN =====
const DeliveryPlanSlide = ({ n, t }) => {
  const th = useTheme();
  const d = CONTENT.delivery;
  const list = (items, bullet) => items.map(itemText).map((item, j) => (
    <div key={j} className="flex items-start gap-2">
      {bullet}
      <p className={`text-[15px] ${th.sub} font-body leading-snug`}>{item.text}{item.review && <Review />}</p>
    </div>
  ));
  return (
  <Slide num={n} total={t} badge={`${TARGETS.fy} plan`}>
    <SectionTitle pre="Operations & Logistics" title="DELIVERY PLAN" sub={CONTENT.deliverySub} />
    <div className="grid grid-cols-3 gap-4 flex-1 min-h-0 stagger">
      <div className={`${th.cardBg} border ${th.cardBorder} rounded-lg p-4 flex flex-col`}>
        <div className="flex items-center gap-2 mb-3"><Warn size={16} className={th.amber} /><h4 className={`text-[14px] font-heading font-semibold tracking-[.2em] uppercase ${th.text}`}>{d.gapTitle}</h4></div>
        <div className="space-y-2.5 flex-1">{list(d.gap, <div className="w-1 h-1 rounded-full bg-amber-500 mt-1.5 shrink-0"></div>)}</div>
      </div>
      <div className={`${th.cardBg} border ${th.cardBorder} rounded-lg p-4 flex flex-col`}>
        <div className="flex items-center gap-2 mb-3"><Target size={16} className="text-gaf-orange" /><h4 className={`text-[14px] font-heading font-semibold tracking-[.2em] uppercase ${th.text}`}>{d.standardTitle}</h4></div>
        <div className="space-y-2.5 flex-1">{list(d.standard, <Check size={11} className={`${th.green} mt-1 shrink-0`} />)}</div>
      </div>
      <div className="bg-gaf-orange rounded-lg p-4 flex flex-col">
        <div className="flex items-center gap-2 mb-3"><Bolt size={16} className="text-white" /><h4 className="text-[14px] font-heading font-semibold tracking-[.2em] uppercase text-white">{d.actionsTitle}</h4></div>
        <div className="space-y-4 flex-1">
          {d.actions.map((a, i) => (
            <div key={i} className="flex items-start gap-3">
              <span className="w-7 h-7 rounded-full bg-white/20 text-white font-heading font-bold text-[14px] flex items-center justify-center shrink-0">{i + 1}</span>
              <div>
                <p className="text-[16px] font-heading font-semibold text-white leading-tight">{a.h}</p>
                <p className="text-[14px] font-body text-white/90 leading-snug mt-1">{a.b}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  </Slide>
  );
};

// ===== APP =====
const SLIDES = [TitleSlide, PerfSlide, UpliftSlide, SalesSlide, TargetsSlide, CommercialPlanSlide, DeliveryPlanSlide];

function App() {
  const [idx, setIdx] = useState(0);
  const [key, setKey] = useState(0);
  const [dark, setDark] = useState(false);
  const [zoom, setZoom] = useState(() => Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
  const th = dark ? themes.dark : themes.light;

  const go = useCallback((dir) => {
    const next = idx + dir;
    if (next >= 0 && next < SLIDES.length) { setIdx(next); setKey(k => k + 1); }
  }, [idx]);

  useEffect(() => {
    const calc = () => setZoom(Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  useEffect(() => {
    const h = e => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'd' || e.key === 'D') setDark(d => !d);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [go]);

  useEffect(() => {
    document.body.style.background = th.bodyBg;
    document.body.className = th.grainClass;
  }, [dark]);

  const C = SLIDES[idx];
  return (
    <ThemeCtx.Provider value={th}>
      <div className="w-screen h-screen overflow-hidden flex items-center justify-center" style={{background: th.bodyBg}}>
        <div key={key} className="overflow-hidden slide-enter rounded-lg shrink-0" style={{width: 1600, height: 900, zoom, boxShadow: dark ? '0 0 80px rgba(0,0,0,.6)' : '0 4px 60px rgba(0,0,0,.12)'}}>
          <C n={idx + 1} t={SLIDES.length} />
          {/* Nav + theme toggle */}
          <div className="absolute bottom-6 right-8 flex gap-2 z-50">
            <button onClick={() => setDark(d => !d)} title="Toggle theme (D)"
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}>
              {dark ? <Sun size={14} /> : <Moon size={14} />}
            </button>
            <div className="w-px h-9 bg-gaf-orange/20"></div>
            <button onClick={() => go(-1)} disabled={idx===0}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===0 ? th.navDisabled : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
              <ChevL size={16} />
            </button>
            <button onClick={() => go(1)} disabled={idx===SLIDES.length-1}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===SLIDES.length-1 ? th.navDisabled : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
              <ChevR size={16} />
            </button>
          </div>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
