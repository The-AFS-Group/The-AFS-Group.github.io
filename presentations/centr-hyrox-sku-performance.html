// ===== DONUT =====
const Donut = ({ data, size=200, thickness=24 }) => {
  const th = useTheme();
  const r=(size-thickness)/2, c=2*Math.PI*r, total=data.reduce((s,d)=>s+d.value,0);
  let cum=0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={th.donutTrack} strokeWidth={thickness}/>
      {data.map((d,i)=>{const pct=d.value/total, offset=c*(1-pct), rot=cum*360; cum+=pct;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={thickness}
          strokeDasharray={c} style={{'--circumference':c,'--dash-offset':offset}} className="donut-animate" strokeDashoffset={c}
          transform={`rotate(${rot} ${size/2} ${size/2})`}/>;})}
    </svg>
  );
};

  const [page, setPage] = useState(0);

  const enriched = useMemo(()=> DATA.skus.map(s=>({...s, fam:family(s.desc)})), []);
  const filtered = useMemo(()=>{
    const term = q.trim().toLowerCase();
    let r = term ? enriched.filter(s => s.sku.toLowerCase().includes(term) || s.desc.toLowerCase().includes(term) || s.fam.toLowerCase().includes(term)) : enriched;
    r = [...r].sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();return sortDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);}
      return sortDir==='asc'?av-bv:bv-av;
    });
    return r;
  }, [q, sortKey, sortDir, enriched]);

  useEffect(()=>{ setPage(0); }, [q, sortKey, sortDir]);
  const pages = Math.max(1, Math.ceil(filtered.length/PER_PAGE));

          {slice.length===0 && (
            <tr><td colSpan="8" className={`px-3 py-10 text-center ${th.muted} font-body text-[14px]`}>No SKUs match “{q}”.</td></tr>
          )}
        </tbody>
      </table>
    </div>

    <div className="flex items-center justify-between mt-3 shrink-0">
      <p className={`text-[13px] font-body ${th.sub}`}>
        Showing <span className={`font-semibold ${th.text}`}>{filtered.length}</span> of {DATA.meta.n_skus} SKUs
        {q && <span> · filtered</span>} · <span className="text-gaf-orange font-semibold">{fmt(fRev)}</span> · {fUnits.toLocaleString()} units
      </p>
      <div className="flex items-center gap-3" style={{marginRight:'150px'}}>
        <span className={`text-[13px] font-body ${th.sub}`}>Page <span className={`font-semibold ${th.text}`}>{cur+1}</span> / {pages}</span>
        <div className="flex gap-1.5">
          <button onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={cur===0}
            className={`w-8 h-8 rounded-md flex items-center justify-center border transition-all ${cur===0?th.navDisabled:`${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}><ChevL size={15}/></button>
          {Array.from({length:pages}).map((_,i)=>(
            <button key={i} onClick={()=>setPage(i)}
              className={`w-8 h-8 rounded-md text-[13px] font-heading font-semibold border transition-all ${i===cur?'bg-gaf-orange border-gaf-orange text-white':`${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>{i+1}</button>
          ))}
          <button onClick={()=>setPage(p=>Math.min(pages-1,p+1))} disabled={cur===pages-1}
            className={`w-8 h-8 rounded-md flex items-center justify-center border transition-all ${cur===pages-1?th.navDisabled:`${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}><ChevR size={15}/></button>
        </div>
      </div>
    </div>
  </Slide>);
};

// ===== SLIDE 5: METHOD / CLOSE =====
const CloseSlide = ({ n, t }) => {
  const th = useTheme();
  return (
  <Slide num={n} total={t}>
    <SectionTitle pre="Reference" title="ABOUT THIS DATA" sub="Scope, method and definitions"/>
    <div className="flex flex-1 gap-6 min-h-0">
      <div className="flex-1 grid grid-cols-2 gap-4 stagger">
        {[
          { h:'Scope', b:`All Centr x Hyrox branded SKUs: every product with "Hyrox" in the product name. Non-Hyrox Centr lines (home gyms, treadmills, functional trainers) are excluded.` },
          { h:'Period', b:`${monthYear(DATA.monthly[0].m)} to ${monthYear(DATA.monthly[DATA.monthly.length-1].m)}. ${DATA.meta.months} months of trading, the full history of the range.` },
          { h:'Metric', b:`Top-line revenue (AUD, ex-GST) and units, aggregated per SKU across all four channels: Retail, Commercial, Online and Wholesale.` },
          { h:'Source', b:`GAF product sales performance export. Figures reflect billed sales; a small number of export orders (US, NZ, India) are included at AUD value.` },
        ].map((c,i)=>(
          <div key={i} className={`${th.cardBg} border ${th.cardBorder} rounded-lg p-5 flex flex-col`}>
            <p className="text-[13px] font-heading tracking-[.3em] text-gaf-orange uppercase mb-2">{c.h}</p>
            <p className={`text-[15px] font-body ${th.sub} leading-relaxed`}>{c.b}</p>
          </div>
        ))}
      </div>
      <div className={`w-[300px] shrink-0 ${th.cardBg} border-l-2 border-gaf-orange rounded-lg p-5 flex flex-col justify-center`}>
        <p className="text-[13px] font-heading tracking-[.3em] text-gaf-orange uppercase mb-4">At a Glance</p>
        <div className="space-y-4">
          <div><p className={`text-3xl font-heading font-bold ${th.text}`}>{fmt(DATA.meta.total_rev)}</p><p className={`text-[13px] ${th.sub} font-body`}>total revenue</p></div>
          <div className={`border-t ${th.cardBorder} pt-4`}><p className={`text-3xl font-heading font-bold ${th.text}`}>{DATA.meta.n_skus}</p><p className={`text-[13px] ${th.sub} font-body`}>active SKUs</p></div>
          <div className={`border-t ${th.cardBorder} pt-4`}><p className={`text-3xl font-heading font-bold text-gaf-orange`}>{DATA.meta.total_units.toLocaleString()}</p><p className={`text-[13px] ${th.sub} font-body`}>units sold</p></div>
        </div>
      </div>
    </div>
  </Slide>);
};

// ===== APP =====
const SLIDES = [TitleSlide, PerfSlide, MixSlide, SkuSlide, CloseSlide];
function App() {
  const [idx, setIdx] = useState(0);
  const [key, setKey] = useState(0);
  const [dark, setDark] = useState(false);
  const [zoom, setZoom] = useState(()=>Math.min(window.innerWidth/1600, window.innerHeight/900, 1));
  const th = dark ? themes.dark : themes.light;
  const go = useCallback(dir=>{const next=idx+dir; if(next>=0&&next<SLIDES.length){setIdx(next);setKey(k=>k+1);}},[idx]);
  useEffect(()=>{const calc=()=>setZoom(Math.min(window.innerWidth/1600,window.innerHeight/900,1));window.addEventListener('resize',calc);return()=>window.removeEventListener('resize',calc);},[]);
  useEffect(()=>{const h=e=>{
    const typing = e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA');
    if(e.key==='ArrowRight'){e.preventDefault();go(1);} else if(e.key==='ArrowLeft'){go(-1);}
    else if((e.key==='d'||e.key==='D')&&!typing) setDark(d=>!d);
  };window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[go]);
  useEffect(()=>{document.body.style.background=th.bodyBg;document.body.className=th.grainClass;},[dark]);
  const C = SLIDES[idx];
  return (
    <ThemeCtx.Provider value={th}>
      <div className="w-screen h-screen overflow-hidden flex items-center justify-center" style={{background:th.bodyBg}}>
        <div key={key} className="overflow-hidden slide-enter rounded-lg shrink-0 relative" style={{width:1600,height:900,zoom,boxShadow:dark?'0 0 80px rgba(0,0,0,.6)':'0 4px 60px rgba(0,0,0,.12)'}}>
          <C n={idx+1} t={SLIDES.length}/>
          <div className="absolute bottom-6 right-8 flex gap-2 z-50">
            <button onClick={()=>setDark(d=>!d)} title="Toggle theme (D)"
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}>
              {dark?<Sun size={14}/>:<Moon size={14}/>}
            </button>
            <div className="w-px h-9 bg-gaf-orange/20"></div>
            <button onClick={()=>go(-1)} disabled={idx===0}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===0?th.navDisabled:`${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}><ChevL size={16}/></button>
            <button onClick={()=>go(1)} disabled={idx===SLIDES.length-1}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===SLIDES.length-1?th.navDisabled:`${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}><ChevR size={16}/></button>
          </div>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}
const root = createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
