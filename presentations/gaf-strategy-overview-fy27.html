import React, { useState, useEffect, useCallback, createContext, useContext } from 'https://esm.sh/react@19.1.0';
import { createRoot } from 'https://esm.sh/react-dom@19.1.0/client';

/* ===================== THEME =====================
   Two complete token maps, light and dark. Every slide reads from
   useTheme() and never hardcodes a colour. Toggle with D.
   Brand-tailoring = editing these two objects and the block above. */
const ThemeCtx = createContext();
const useTheme = () => useContext(ThemeCtx);

const themes = {
  light: {
    bg: 'bg-white', bg2: 'bg-lt-card', bg3: 'bg-lt-card2',
    border: 'border-lt-border', borderAccent: 'border-brand-accent/20',
    text: 'text-lt-text', sub: 'text-lt-sub', muted: 'text-lt-muted', textInv: 'text-white',
    cardBg: 'bg-lt-card', cardBorder: 'border-lt-border',
    bodyBg: '#f0f0f0', logoFilter: '',
    kpiAccentBg: 'bg-brand-accent/5',
    navBg: 'bg-black/5', navBorder: 'border-black/10', navText: 'text-lt-text',
    navHover: 'hover:bg-brand-accent hover:border-brand-accent hover:text-white',
    navDisabled: 'bg-black/5 text-lt-muted cursor-not-allowed',
    green: 'text-emerald-600', greenBg: 'bg-emerald-500/10', greenBorder: 'border-emerald-500/25',
    amber: 'text-amber-600',   amberBg: 'bg-amber-500/10',   amberBorder: 'border-amber-500/25',
    red:   'text-rose-600',    redBg:   'bg-rose-500/10',    redBorder:   'border-rose-500/25',
    imgBg: 'bg-white', footerText: 'text-lt-muted',
    barStrong: 'bg-lt-text', barMid: 'bg-brand-ash', barSoft: 'bg-lt-card2', track: 'bg-lt-card2', tick: 'bg-lt-text', markerBorder: 'border-lt-text',
  },
  dark: {
    bg: 'bg-brand-black', bg2: 'bg-brand-dark', bg3: 'bg-brand-mid',
    border: 'border-brand-steel/20', borderAccent: 'border-brand-accent/20',
    text: 'text-white', sub: 'text-brand-ash', muted: 'text-lt-muted', textInv: 'text-brand-black',
    cardBg: 'bg-brand-dark', cardBorder: 'border-brand-steel/20',
    bodyBg: '#000000', logoFilter: 'brightness-0 invert',
    kpiAccentBg: 'bg-brand-accent/5',
    navBg: 'bg-white/5', navBorder: 'border-white/10', navText: 'text-white',
    navHover: 'hover:bg-brand-accent hover:border-brand-accent',
    navDisabled: 'bg-brand-steel/20 text-brand-steel cursor-not-allowed',
    green: 'text-emerald-400', greenBg: 'bg-emerald-500/10', greenBorder: 'border-emerald-500/25',
    amber: 'text-amber-400',   amberBg: 'bg-amber-500/10',   amberBorder: 'border-amber-500/25',
    red:   'text-rose-400',    redBg:   'bg-rose-500/10',    redBorder:   'border-rose-500/25',
    imgBg: 'bg-white', footerText: 'text-brand-steel',
    barStrong: 'bg-white', barMid: 'bg-brand-ash', barSoft: 'bg-brand-steel', track: 'bg-brand-steel', tick: 'bg-white', markerBorder: 'border-white',
  }
};

/* ===================== ICONS =====================
   Inline SVG, no icon library. Add what you need, delete what you don't.
   Paths are Lucide geometry (lucide.dev), 1.5 stroke, rounded caps. */
const I = p => (
  <svg xmlns="http://www.w3.org/2000/svg" width={p.size||18} height={p.size||18} viewBox="0 0 24 24"
       fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"
       className={p.className||''}>
    {Array.isArray(p.d) ? p.d.map((d,i) => <path key={i} d={d} />) : <path d={p.d} />}
  </svg>
);
const ChevL  = p => <I {...p} d="M15 18l-6-6 6-6" />;
const ChevR  = p => <I {...p} d="M9 18l6-6-6-6" />;
const Sun    = p => <I {...p} d={["M12 1v2","M12 21v2","M4.22 4.22l1.42 1.42","M18.36 18.36l1.42 1.42","M1 12h2","M21 12h2","M4.22 19.78l1.42-1.42","M18.36 5.64l1.42-1.42"]} />;
const Moon   = p => <I {...p} d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />;
const Dollar = p => <I {...p} d={["M12 2v20","M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"]} />;
const Users  = p => <I {...p} d={["M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2","M12 7a4 4 0 100-8 4 4 0 000 8","M22 21v-2a4 4 0 00-3-3.87","M16 3.13a4 4 0 010 7.75"]} />;
const Pkg    = p => <I {...p} d={["M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z","M3.27 6.96L12 12.01l8.73-5.05","M12 22.08V12"]} />;
const Target = p => <I {...p} d={["M12 22a10 10 0 100-20 10 10 0 000 20z","M12 18a6 6 0 100-12 6 6 0 000 12z","M12 14a2 2 0 100-4 2 2 0 000 4z"]} />;
const TrendUp= p => <I {...p} d={["M23 6l-9.5 9.5-5-5L1 18","M17 6h6v6"]} />;
const Check  = p => <I {...p} d="M20 6L9 17l-5-5" />;
const Monitor= p => <I {...p} d={["M4 3h16a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2z","M8 21h8","M12 17v4"]} />;
const Store  = p => <I {...p} d={["M3 9l1.5-5h15L21 9","M3 9h18","M5 9v11h14V9","M10 20v-6h4v6"]} />;
const Briefcase = p => <I {...p} d={["M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z","M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"]} />;
const Warn   = p => <I {...p} d={["M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z","M12 9v4","M12 17h.01"]} />;

/* ===================== BRAND ASSETS ===================== */
const LOGO = 'https://cdn.shopify.com/s/files/1/1950/1891/files/GAFLogo-Primary-WhiteBG_51691f07-8b4f-4d1d-aefc-f2fc004eaa84.png?v=1775792576';

const Logo = ({ dark }) => {
  const th = useTheme();
  // The primary GAF logo asset has a flattened white background (design-system rule:
  // "White or pale grey background ONLY for primary logo"), so it can't be filtered onto a
  // dark surface without showing a white box. Use a text wordmark there instead.
  const onDark = dark || th.logoFilter !== '';
  return onDark
    ? <span className="text-[14px] font-heading font-extrabold tracking-[.1em] uppercase text-white">Gym and Fitness</span>
    : <img src={LOGO} alt="" className="h-7 w-auto" />;
};

/* ===================== SLIDE PRIMITIVES =====================
   Slide        — the 1600x900 frame: padding, logo, slide counter.
   SectionTitle — eyebrow + title + standfirst. Use on every slide but the cover.
   Callout      — the accent strip for the one thing they must take away. */
const Slide = ({ children, num, total, noPad, dark }) => {
  const th = useTheme();
  return (
    <div className={`w-full h-full ${dark ? 'bg-brand-black' : th.bg} flex flex-col ${noPad ? '' : 'px-16 py-12'} relative overflow-hidden`}>
      {children}
      <div className="absolute bottom-6 left-16 right-16 flex items-center justify-between">
        <Logo dark={dark} />
        <span className={`text-[12px] font-heading tracking-[.3em] uppercase ${dark ? 'text-brand-steel' : th.footerText}`}>
          {String(num).padStart(2,'0')} / {String(total).padStart(2,'0')}
        </span>
      </div>
    </div>
  );
};

const SectionTitle = ({ pre, title, sub }) => {
  const th = useTheme();
  return (
    <div className="mb-7 shrink-0">
      {pre && <p className="text-[13px] font-heading font-bold tracking-[.3em] uppercase text-brand-accent mb-2">{pre}</p>}
      <h2 className={`font-display text-5xl uppercase leading-[1.05] ${th.text}`}>{title}</h2>
      {sub && <p className={`text-[16px] font-body ${th.sub} mt-3 max-w-4xl leading-snug`}>{sub}</p>}
    </div>
  );
};

const Callout = ({ icon: Icon = Target, children }) => {
  const th = useTheme();
  return (
    <div className="bg-brand-accent/5 border border-brand-accent/20 rounded-lg p-4 flex items-start gap-3 shrink-0">
      <Icon size={18} className="text-brand-accent shrink-0 mt-0.5" />
      <p className={`text-[15px] font-body ${th.text} leading-snug`}>{children}</p>
    </div>
  );
};

/* ===================== LOCAL PRIMITIVES =====================
   Takeaway — the neutral one-line "so what" strip. Orange is reserved for the
   single highlight on each slide, so this stays grey. */
const Takeaway = ({ children }) => {
  const th = useTheme();
  return (
    <div className={`${th.bg3} rounded-lg px-6 py-4 shrink-0`}>
      <p className={`text-[18px] font-body ${th.text} leading-snug`}>{children}</p>
    </div>
  );
};

const Source = ({ children }) => {
  const th = useTheme();
  return <p className={`text-[12px] font-body ${th.muted} shrink-0 mt-3 mb-7 leading-snug`}>{children}</p>;
};

const Chip = ({ children, solid, strong }) => {
  const th = useTheme();
  return (
    <span className={`inline-block text-[12px] font-heading font-bold tracking-[.12em] uppercase px-3 py-1 rounded-full ${solid ? `${th.barStrong} ${th.textInv}` : strong ? `border-2 ${th.markerBorder} ${th.text}` : `border ${th.cardBorder} ${th.sub}`}`}>
      {children}
    </span>
  );
};

/* ===================== SLIDE 1: THE FY27 STRATEGY =====================
   Who we build for, how we reach them, what it has to deliver (gross profit).
   One orange element: the Home Gym Builder customer bar. */
const StrategySlide = ({ n, t }) => {
  const th = useTheme();
  const archetypes = [
    { name: "Home Gym Builder", cust: 9, note: "Highest profit per customer", hero: true },
    { name: "Budget Seeker", cust: 69.5, note: "High acquisition cost, loses money online" },
    { name: "Performance Optimiser", cust: 12.6, note: "Profitable only with sales team contact" },
  ];
  const channels = [
    { name: "Direct", sub: "Website, sales team, AI Gym Designer", icon: Monitor },
    { name: "Retail & Wholesale", sub: "Experience Centre, Rebel, dealers", icon: Store },
    { name: "Commercial", sub: "Gyms, mining, defence", icon: Briefcase },
  ];
  const q1Gp = 1.73, gpTarget = 9.6;
  return (
    <Slide num={n} total={t}>
      <SectionTitle pre="FY27 Annual Strategy" title="WIN THE HOME GYM BUILDER" sub="Be the No.1 choice for people building a gym at home. Every channel, at a profit." />
      <div className="flex-1 grid grid-cols-3 gap-6 min-h-0">

        {/* WHO */}
        <div className={`${th.cardBg} border ${th.cardBorder} rounded-lg p-6 flex flex-col`}>
          <p className={`text-[13px] font-heading font-bold tracking-[.3em] uppercase ${th.sub}`}>Who we build for</p>
          <div className="flex-1 flex flex-col justify-center gap-6">
            {archetypes.map((a, i) => (
              <div key={i}>
                <p className={`text-[18px] font-heading font-semibold ${th.text} mb-2`}>{a.name}</p>
                <div className="flex items-center gap-3 mb-1.5">
                  <div className={`h-3 rounded-full ${a.hero ? 'bg-brand-accent' : th.barMid}`} style={{ width: `${a.cust * 2.4}px` }}></div>
                  <span className={`text-[15px] font-body ${th.text} font-semibold`}>{a.cust}% of customers</span>
                </div>
                <p className={`text-[15px] font-body ${th.sub} leading-snug`}>{a.note}</p>
              </div>
            ))}
          </div>
          <p className={`text-[15px] font-body ${th.sub} leading-snug`}>A Home Gym Builder earns 2.5x the profit of an online-only buyer.</p>
        </div>

        {/* HOW */}
        <div className={`${th.cardBg} border ${th.cardBorder} rounded-lg p-6 flex flex-col`}>
          <p className={`text-[13px] font-heading font-bold tracking-[.3em] uppercase ${th.sub}`}>How we reach them</p>
          <div className="flex-1 flex flex-col justify-center gap-4">
            {channels.map((c, i) => (
              <div key={i} className={`${th.bg} border ${th.cardBorder} rounded-lg p-5 flex items-center gap-4`}>
                <div className={`w-12 h-12 rounded-lg ${th.bg3} flex items-center justify-center shrink-0`}>
                  <c.icon size={24} className={th.text} />
                </div>
                <div className="flex-1 min-w-0">
                  <p className={`text-[20px] font-heading font-semibold ${th.text}`}>{c.name}</p>
                  <p className={`text-[15px] font-body ${th.sub} leading-snug`}>{c.sub}</p>
                </div>
              </div>
            ))}
          </div>
          <p className={`text-[15px] font-body ${th.sub} leading-snug`}>Retail builds awareness, which lowers direct marketing cost.</p>
        </div>

        {/* WHAT */}
        <div className={`${th.cardBg} border ${th.cardBorder} rounded-lg p-6 flex flex-col`}>
          <p className={`text-[13px] font-heading font-bold tracking-[.3em] uppercase ${th.sub}`}>What it has to deliver</p>
          <div className="flex-1 flex flex-col justify-center gap-8">
            <div>
              <p className={`font-display text-7xl leading-none ${th.text}`}>$9.6M</p>
              <p className={`text-[16px] font-body ${th.sub} mt-2`}>FY27 gross profit target</p>
            </div>
            <div>
              <p className={`font-display text-7xl leading-none ${th.text}`}>&gt;38%</p>
              <p className={`text-[16px] font-body ${th.sub} mt-2`}>gross profit margin target</p>
            </div>
          </div>
          <div className={`border-t ${th.cardBorder} pt-4`}>
            <div className="flex items-baseline justify-between mb-2">
              <p className={`text-[13px] font-heading font-bold tracking-[.12em] uppercase ${th.sub}`}>Q1 gross profit</p>
              <p className={`text-[15px] font-body ${th.text} font-semibold`}>$1.73M of $9.6M</p>
            </div>
            <div className="relative h-3">
              <div className={`absolute inset-0 rounded-full ${th.track}`}></div>
              <div className={`absolute left-0 top-0 h-3 rounded-full ${th.barStrong}`} style={{ width: `${q1Gp / gpTarget * 100}%` }}></div>
            </div>
            <p className={`text-[13px] font-body ${th.muted} mt-2`}>Home gyms built: 1,626 of 10,000 by 2030.</p>
          </div>
        </div>
      </div>
      <div className="mt-5"><Takeaway>Value over profit-poor volume: the top 20% of customers deliver 130% of GAF's profit. Fix the whale, stop selling low-profit customers, products and channels.</Takeaway></div>
      <Source>Sources: Strategy Day debrief (May 2026, Profit Per X); FY27 gross profit targets; GAF Master Dashboard (Q1 gross profit created); top 20% insight via Claire Mula, 8 Oct.</Source>
    </Slide>
  );
};

/* ===================== SLIDE 2: Q1 FY27 =====================
   Outcomes of the four GAF Q1 strategic initiatives (Strategic Priorities tab,
   Asana, Sprint Q1FY27) and the four Q1 critical numbers (OPSP).
   One orange element: the Q1 theme target chip. */
const Q1Slide = ({ n, t }) => {
  const th = useTheme();
  const initiatives = [
    { name: "Home Gym Builder plan + AI Gym Designer", owner: "Shanice Thomas", done: 10, total: 10, status: "Complete",
      outcome: "Plan delivered, AI Designer live and wired to HubSpot. 104 designs vs 100 milestone." },
    { name: "SKU health + GMROI visibility", owner: "Michelle Wiseman", done: 3, total: 3, status: "Complete",
      outcome: "Weekly SKU health reporting live, GMROI method and dashboard in place." },
    { name: "Remove 50% of red and blue SKUs", owner: "Chris Ward", done: 3, total: 4, status: "On Track",
      outcome: "Categorisation and core lists done. Website AOV listings still open." },
    { name: "Wholesale partner pricing program", owner: "Sue Lewis", done: 8, total: 8, status: "Complete",
      outcome: "Dealer audit, segmentation and tiered pricing built and presented to the GM." },
  ];
  // bands run red, yellow, green, super green; `at` is the band index the result landed in
  const numbers = [
    { name: "GC dead stock", value: "$404k", note: "down from $692k", bands: ["≥$692k", "<$692k", "<$550k", "<$400k"], at: 2, badge: "Green" },
    { name: "GAF AOV growth", value: "+5%", note: "target 4%", bands: ["3%", "3.5%", "4%", "5%"], at: 3, badge: "Super green" },
    { name: "GAF IDC GP%", value: "42.6%", note: "target above 40%", bands: ["<38%", "38%", "40%", ">40%"], at: 3, badge: "Super green" },
    { name: "Gym designs created", value: "104", note: "target 15", bands: ["5", "10", "15", "20"], at: 3, badge: "Super green" },
  ];
  return (
    <Slide num={n} total={t}>
      <SectionTitle pre="Quarter 1 FY27 Recap" title="Q1: DROP THE DEAD WEIGHT" sub="1 Jul to 30 Sep 2026. Every critical number landed green or better." />
      <div className="flex-1 grid grid-cols-12 gap-6 min-h-0">

        {/* Strategic initiatives */}
        <div className={`col-span-7 ${th.cardBg} border ${th.cardBorder} rounded-lg p-6 flex flex-col min-h-0`}>
          <div className="flex items-center justify-between">
            <p className={`text-[13px] font-heading font-bold tracking-[.3em] uppercase ${th.sub}`}>Strategic initiatives</p>
            <p className={`text-[14px] font-body ${th.sub}`}>3 of 4 complete</p>
          </div>
          <div className="flex-1 flex flex-col justify-around gap-2 pt-3 min-h-0">
            {initiatives.map((p, i) => (
              <div key={i} className={`${th.bg} border ${th.cardBorder} rounded-lg px-5 py-3`}>
                <div className="flex items-center justify-between gap-4">
                  <p className={`text-[18px] font-heading font-semibold ${th.text}`}>{p.name}</p>
                  <Chip solid={p.status === "Complete"}>{p.status}</Chip>
                </div>
                <div className="flex items-center gap-4 mt-2">
                  <div className="relative h-2.5 flex-1">
                    <div className={`absolute inset-0 rounded-full ${th.track}`}></div>
                    <div className={`absolute left-0 top-0 h-2.5 rounded-full ${th.barStrong}`} style={{ width: `${p.done / p.total * 100}%` }}></div>
                  </div>
                  <p className={`text-[14px] font-heading font-bold ${th.text} w-[110px] text-right`}>{Math.round(p.done / p.total * 100)}% · {p.done}/{p.total}</p>
                </div>
                <p className={`text-[14px] font-body ${th.sub} mt-2 leading-snug`}>{p.outcome} <span className={th.muted}>· {p.owner}</span></p>
              </div>
            ))}
          </div>
        </div>

        {/* Critical numbers */}
        <div className={`col-span-5 ${th.cardBg} border ${th.cardBorder} rounded-lg p-6 flex flex-col min-h-0`}>
          <div className="flex items-center justify-between">
            <p className={`text-[13px] font-heading font-bold tracking-[.3em] uppercase ${th.sub}`}>Critical numbers</p>
            <span className="inline-block text-[14px] font-heading font-bold px-3 py-1 rounded-full bg-brand-accent text-white">Dead stock $692k to under $400k</span>
          </div>
          <div className="flex-1 grid grid-cols-2 gap-4 pt-3">
            {numbers.map((c, i) => (
              <div key={i} className={`${th.bg} border ${th.cardBorder} rounded-lg p-4 flex flex-col`}>
                <p className={`text-[14px] font-heading font-semibold ${th.sub}`}>{c.name}</p>
                <p className={`font-display text-5xl leading-none ${th.text} mt-3`}>{c.value}</p>
                <p className={`text-[13px] font-body ${th.muted} mt-1`}>{c.note}</p>
                <div className="flex-1"></div>
                <div className="grid grid-cols-4 gap-1 mt-3">
                  {c.bands.map((_, j) => (
                    <div key={j} className={`h-2.5 rounded-sm ${j === c.at ? th.barStrong : th.track}`}></div>
                  ))}
                </div>
                <div className="grid grid-cols-4 gap-1 mt-1">
                  {c.bands.map((l, j) => (
                    <p key={j} className={`text-[11px] font-body text-center ${j === c.at ? th.text : th.muted}`}>{l}</p>
                  ))}
                </div>
                <p className={`text-[12px] font-heading font-bold tracking-[.12em] uppercase ${th.text} mt-2`}>{c.badge}</p>
              </div>
            ))}

      <Source>Sources: GAF Master Dashboard, Strategic Priorities tab (Asana, Sprint Q1FY27, progress = completed subtasks, 19 Oct); Q1 FY27 OPSP critical numbers, frozen at 30 Sep. Bands run red, yellow, green, super green.</Source>
    </Slide>
  );
};

/* ===================== ENGINE =====================
   Do not edit below this line when building a deck. Add or remove
   components in SLIDES; everything else is the shared contract. */
const SLIDES = [StrategySlide, Q1Slide, Q2Slide];

function App() {
  const [idx, setIdx]   = useState(0);
  const [key, setKey]   = useState(0);
  const [dark, setDark] = useState(false);
  const [zoom, setZoom] = useState(() => Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
  const th = dark ? themes.dark : themes.light;

  const go = useCallback((dir) => {
    setIdx(prev => {
      const next = prev + dir;
      if (next >= 0 && next < SLIDES.length) { setKey(k => k + 1); return next; }
      return prev;
    });
  }, []);

  useEffect(() => {
    const calc = () => setZoom(Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'd' || e.key === 'D') setDark(v => !v);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [go]);

  useEffect(() => { document.body.style.background = th.bodyBg; }, [th.bodyBg]);

  const Cur = SLIDES[idx];

  return (
    <ThemeCtx.Provider value={th}>
      <div className="w-screen h-screen flex items-center justify-center" style={{background: th.bodyBg}}>
        <div style={{width: 1600, height: 900, transform: `scale(${zoom})`, transformOrigin: 'center'}} className="relative shadow-2xl">
          <div key={key} className="w-full h-full slide-enter">
            <Cur n={idx + 1} t={SLIDES.length} />
          </div>
        </div>
        <div className="fixed bottom-6 right-6 flex items-center gap-2 z-50">
          <button onClick={() => setDark(v => !v)} title="Toggle theme (D)"
            className={`w-10 h-10 rounded-lg border ${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover} flex items-center justify-center transition-colors`}>
            {dark ? <Sun size={18} /> : <Moon size={18} />}
          </button>
          <button onClick={() => go(-1)} disabled={idx === 0} title="Previous"
            className={`w-10 h-10 rounded-lg border flex items-center justify-center transition-colors ${idx === 0 ? th.navDisabled + ' ' + th.navBorder : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
            <ChevL size={18} />
          </button>
          <button onClick={() => go(1)} disabled={idx === SLIDES.length - 1} title="Next"
            className={`w-10 h-10 rounded-lg border flex items-center justify-center transition-colors ${idx === SLIDES.length - 1 ? th.navDisabled + ' ' + th.navBorder : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
            <ChevR size={18} />
          </button>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
