// ===== DONUT =====
const Donut = ({ data, size = 200, thickness = 24 }) => {
  const th = useTheme();
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  const total = data.reduce((s, d) => s + d.value, 0);
  let cum = 0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={th.donutTrack} strokeWidth={thickness} />
      {data.map((d, i) => {
        const pct = d.value / total; const offset = c * (1 - pct); const rotation = cum * 360; cum += pct;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={thickness}
          strokeDasharray={c} style={{'--circumference': c, '--dash-offset': offset}}
          className="donut-animate" strokeDashoffset={c}
          transform={`rotate(${rotation} ${size/2} ${size/2})`} />;
      })}
    </svg>
  );
};

                <span className={`text-[7px] font-body font-semibold ${th.sub} mb-1`}>{(d.v/1000).toFixed(0)}K</span>
                <div className="w-full rounded-sm bar-grow origin-bottom" style={{
                  height: `${(d.v / maxV) * 90}%`, minHeight: '3px',
                  background: `linear-gradient(to top, #f26422, ${d.v === maxV ? '#ff8a50' : '#c03008'})`,
                  animationDelay: `${i * 0.05}s`
                }}></div>
                <span className={`text-[8px] ${th.muted} mt-2 font-body`}>{d.m}</span>
              </div>
            ))}
          </div>
          <p className={`text-[10px] ${th.sub} font-body mt-3 pt-3 border-t ${th.cardBorder} shrink-0 leading-snug`}><span className="text-gaf-orange font-semibold">Why the May–Jun step-up?</span> A deliberate brand-awareness campaign switching on — reach-optimised spend to branded Nike pages, by design (not an organic swing) — reach is the objective, sales the by-product.</p>
        </div>
        <div className="w-[300px] shrink-0 flex flex-col">
          <p className={`text-[9px] font-heading tracking-[.3em] ${th.sub} uppercase mb-3`}>Traffic Sources</p>
          <div className="flex flex-col gap-2 flex-1 justify-center">
            {trafficChannels.map((c, i) => {
              const pct = (c.sessions / totalSess * 100);
              return (
              <div key={i}>
                <div className="flex items-center justify-between mb-1">
                  <span className={`text-[10px] font-body ${th.sub}`}>{c.name}</span>
                  <span className={`text-[10px] font-heading font-semibold ${th.text}`}>{pct.toFixed(0)}%</span>
                </div>
                <div className={`h-1.5 rounded-full ${th.bg3} overflow-hidden`}>
                  <div className="h-full rounded-full fill-anim" style={{'--target-w': `${pct}%`, width:0, background: c.color, animationDelay:`${i*0.06}s`}}></div>
                </div>
              </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  </Slide>
  );
};

// ===== SLIDE: IMPRESSIONS AT SCALE (Meta) =====
const ImpressionsSlide = ({ n, t }) => {
  const th = useTheme();
  const maxV = Math.max(...monthlyImpr.map(d => d.v));
  const fmt = v => v >= 950000 ? (v/1e6).toFixed(2)+'M' : (v/1000).toFixed(0)+'K';
  return (
  <Slide num={n} total={t}>
    <SectionTitle pre="2 · Share of Mind" title="IMPRESSIONS AT SCALE" sub="Meta ad impressions for Nike Strength campaigns. When we switched the awareness push on in May, monthly impressions stepped up roughly 5x — from ~200K to over a million a month." />
    <div className="flex flex-col flex-1 gap-5 min-h-0">
      <div className="grid grid-cols-4 gap-4 shrink-0 stagger">
        <Kpi label="Impressions · 12 mo" value="4.0M" sub="Nike Strength campaigns" />
        <Kpi label="Peak Month" value="1.08M" sub="June 2026" />
        <Kpi label="Step-Up" value="≈5x" sub="vs the prior baseline" accent />
        <Kpi label="People Reached" value="649K" sub="in June alone" />
      </div>
      <div className={`flex-1 ${th.cardBg} rounded-lg border ${th.cardBorder} p-5 min-h-0 flex flex-col`}>
        <div className="flex items-center justify-between mb-4">
          <p className={`text-[9px] font-heading tracking-[.3em] ${th.sub} uppercase`}>Monthly Ad Impressions — Nike Strength</p>
          <p className={`text-[10px] ${th.sub} font-body`}>Awareness campaign live from <span className="text-gaf-orange font-semibold">May 2026</span></p>
        </div>
        <div className="flex items-end gap-2 flex-1">
          {monthlyImpr.map((d, i) => (
            <div key={i} className="flex-1 flex flex-col items-center justify-end h-full">
              <span className={`text-[8px] font-body font-semibold ${th.sub} mb-1`}>{fmt(d.v)}</span>
              <div className="w-full rounded-sm bar-grow origin-bottom" style={{
                height: `${(d.v / maxV) * 92}%`, minHeight: '3px',
                background: `linear-gradient(to top, #f26422, ${d.v === maxV ? '#ff8a50' : '#c03008'})`,
                animationDelay: `${i * 0.05}s`
              }}></div>
              <span className={`text-[8px] ${th.muted} mt-2 font-body`}>{d.m}</span>
            </div>
          ))}
        </div>
        <p className={`text-[10px] ${th.sub} font-body mt-3 pt-3 border-t ${th.cardBorder} shrink-0`}><span className="text-gaf-orange font-semibold">The step-change is the story:</span> a sustained ~5x lift in how often Australians see Nike Strength — the top of the funnel that feeds every channel below it.</p>
      </div>
    </div>
  </Slide>
  );
};

// ===== SLIDE: TOP CREATIVE (best reels by reach) =====
const ContentSlide = ({ n, t }) => {
  const th = useTheme();
  return (
  <Slide num={n} total={t}>
    <SectionTitle pre="5 · Brand In Market" title="TOP CREATIVE" sub="Our five best-performing Nike Strength reels by paid reach — the creative driving the awareness campaign. 935K combined reach." />
    <div className="flex gap-4 flex-1 min-h-0 items-center justify-center stagger">
      {reels.map((r, i) => (
        <div key={i} className={`relative flex-1 max-w-[290px] aspect-[9/16] rounded-xl overflow-hidden border ${th.cardBorder} shadow-lg group`}>
          <img src={r.src} alt={r.name} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} />
          <div className="absolute top-2.5 left-2.5 w-7 h-7 rounded-full bg-gaf-orange flex items-center justify-center text-[12px] font-heading font-bold text-white shadow">{i+1}</div>
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div className="w-12 h-12 rounded-full bg-black/35 border border-white/50 flex items-center justify-center backdrop-blur-sm">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/95 via-black/55 to-transparent px-3 pt-8 pb-3">
            <div className="flex items-baseline gap-1.5">
              <p className="text-xl font-heading font-bold text-white leading-none">{r.reach}</p>
              <p className="text-[8px] font-heading tracking-[.2em] text-gaf-orange uppercase">paid reach</p>
            </div>
            <p className="text-[9px] font-body text-white/80 mt-1.5 leading-tight">{r.name}</p>
          </div>
        </div>
      ))}
    </div>
    <div className={`mt-3 flex items-center justify-between ${th.cardBg} border ${th.cardBorder} rounded-lg px-5 py-2.5 shrink-0`}>
      <p className="text-[9px] font-heading tracking-[.3em] text-gaf-orange uppercase">Reels build the reach</p>
      <div className="flex items-center gap-2"><span className={`text-[10px] font-body ${th.sub}`}>Short-form video — athletes, unboxings and product hero cuts — is the format doing the heavy lifting on awareness</span></div>
    </div>
  </Slide>
  );
};

const SLIDES = [TitleSlide, PerfSlide, DigitalSlide, ImpressionsSlide, ChannelSlide, BrandSlide, ContentSlide, StrategySlide, SupplySlide, WishlistSlide, CloseSlide];

function App() {
  const [idx, setIdx] = useState(0);
  const [key, setKey] = useState(0);
  const [dark, setDark] = useState(false);
  const [scale, setScale] = useState(1);
  const th = dark ? themes.dark : themes.light;
  const go = useCallback((dir) => {
    const next = idx + dir;
    if (next >= 0 && next < SLIDES.length) { setIdx(next); setKey(k => k + 1); }
  }, [idx]);
  useEffect(() => {
    const h = e => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'd' || e.key === 'D') setDark(d => !d);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [go]);
  // Scale the fixed 1600×900 stage to fit any viewport (letterboxed) so nothing crops on shorter laptop screens.
  useEffect(() => {
    const fit = () => setScale(Math.min(window.innerWidth / 1600, window.innerHeight / 900));
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  useEffect(() => { document.body.style.background = th.bodyBg; document.body.className = th.grainClass; }, [dark]);
  const C = SLIDES[idx];
  return (
    <ThemeCtx.Provider value={th}>
      <div className={`w-screen h-screen flex items-center justify-center overflow-hidden`} style={{background: th.bodyBg}}>
        <div style={{width:1600, height:900, transform:`scale(${scale})`, transformOrigin:'center center', flexShrink:0}}>
        <div key={key} className="w-full h-full relative overflow-hidden slide-enter rounded-lg" style={{boxShadow: dark ? '0 0 80px rgba(0,0,0,.6)' : '0 4px 60px rgba(0,0,0,.12)'}}>
          <C n={idx + 1} t={SLIDES.length} />
          <div className="absolute bottom-6 right-8 flex gap-2 z-50">
            <button onClick={() => setDark(d => !d)} title="Toggle theme (D)"
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}>
              {dark ? <Sun size={14} /> : <Moon size={14} />}
            </button>
            <div className="w-px h-9 bg-gaf-orange/20"></div>
            <button onClick={() => go(-1)} disabled={idx===0}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===0 ? th.navDisabled : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}><ChevL size={16} /></button>
            <button onClick={() => go(1)} disabled={idx===SLIDES.length-1}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===SLIDES.length-1 ? th.navDisabled : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}><ChevR size={16} /></button>
          </div>
        </div>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}
const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
