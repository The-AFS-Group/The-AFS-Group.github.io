.stagger>*:nth-child(1){animation-delay:.05s}
.stagger>*:nth-child(2){animation-delay:.12s}
.stagger>*:nth-child(3){animation-delay:.19s}
.stagger>*:nth-child(4){animation-delay:.26s}

.fill-anim{animation:fillWidth 1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes fillWidth{from{width:0}to{width:var(--target-w)}}

.donut-animate{animation:donutDraw 1.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes donutDraw{from{stroke-dashoffset:var(--circumference)}to{stroke-dashoffset:var(--dash-offset)}}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#f26422;border-radius:10px}

.slash{position:absolute;width:200%;height:1px;transform:rotate(-12deg)}

.print-root{display:none}

// ===== DONUT CHART =====
const Donut = ({ data, size = 220, thickness = 28 }) => {
  const th = useTheme();
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  const total = data.reduce((s, d) => s + d.value, 0);
  let cum = 0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={th.donutTrack} strokeWidth={thickness} />
      {data.map((d, i) => {
        const pct = d.value / total;
        const offset = c * (1 - pct);
        const rotation = cum * 360;
        cum += pct;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={thickness}
          strokeDasharray={c} style={{'--circumference': c, '--dash-offset': offset}}
          className="donut-animate" strokeDashoffset={c}
          transform={`rotate(${rotation} ${size/2} ${size/2})`} />;
      })}
    </svg>
  );
};

const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const totalRev = sum(monthlyData, m => m.rev);
const peak = monthlyData.reduce((a, b) => (b.rev > a.rev ? b : a));
const half = Math.floor(monthlyData.length / 2);

};

const sumArr = a => a.reduce((s, x) => s + x, 0);

// ===== CLICK-TO-EDIT =====
// Edits are stored per slide as { i: element position, from: original html, to: edited html }.
// They autosave in this browser (localStorage). "Download deck" bakes them into a copy of this file
// (the <script id="deck-edits"> tag), so everyone who opens that copy sees the edited text.
const BAKED = (() => { try { return JSON.parse(document.getElementById('deck-edits').textContent); } catch (e) { return { stamp: 0, edits: {} }; } })();
const LS_KEY = 'repFitnessEdits:' + (BAKED.stamp || 0);
const loadEdits = () => {
  try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (e) {}
  return JSON.parse(JSON.stringify(BAKED.edits || {}));
};
const persistEdits = (edits) => { try { localStorage.setItem(LS_KEY, JSON.stringify(edits)); } catch (e) {} };
const countEdits = (edits) => Object.values(edits).reduce((s, l) => s + (l ? l.length : 0), 0);
// Outermost elements that hold their own text (so a paragraph with a REVIEW tag edits as one block).
const collectEditable = (root) => {
  const out = [];
  const walk = (el) => {
    for (const c of el.children) {
      if (c instanceof SVGElement || c.tagName === 'IMG' || c.tagName === 'SCRIPT' || c.hasAttribute('data-noedit')) continue;
      const hasText = [...c.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
      if (hasText) out.push(c); else walk(c);
    }
  };
  walk(root);
  return out;
};
const saveFile = (content, name, type) => {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

// ===== APP =====
const SLIDES = [TitleSlide, PerfSlide, UpliftSlide, SalesSlide, TopSellersSlide, CategoryMixSlide, TargetsSlide];

function App() {
  const [idx, setIdx] = useState(0);
  const [key, setKey] = useState(0);
  const [dark, setDark] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [printing, setPrinting] = useState(false);
  const [editCount, setEditCount] = useState(() => countEdits(loadEdits()));
  const [zoom, setZoom] = useState(() => Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
  const th = dark ? themes.dark : themes.light;
  const stageRef = useRef(null);
  const fileRef = useRef(null);
  const printRef = useRef(null);
  const editsRef = useRef(loadEdits());
  const elsRef = useRef([]);
  const origRef = useRef([]);

  const go = useCallback((dir) => {
    const next = idx + dir;
    if (next >= 0 && next < SLIDES.length) { setIdx(next); setKey(k => k + 1); }
  }, [idx]);

  useEffect(() => {
    const calc = () => setZoom(Math.min(window.innerWidth / 1600, window.innerHeight / 900, 1));
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  useEffect(() => {
    const h = e => {
      if (e.target && e.target.isContentEditable) return;           // typing on a slide
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'd' || e.key === 'D') setDark(d => !d);
      else if (e.key === 'e' || e.key === 'E') setEditMode(m => !m);
      else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); setPrinting(true); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [go]);

  useEffect(() => {
    document.body.style.background = th.bodyBg;
    document.body.className = th.grainClass + (editMode ? ' edit-on' : '');
  }, [dark, editMode]);

  // Each time a slide is mounted: find its editable text, remember the originals, apply saved edits.
  useLayoutEffect(() => {
    const els = collectEditable(stageRef.current);
    elsRef.current = els;
    origRef.current = els.map(e => e.innerHTML);
    (editsRef.current[idx] || []).forEach(({ i, from, to }) => {
      if (els[i] && origRef.current[i] === from) els[i].innerHTML = to;
    });
    els.forEach(e => { e.setAttribute('data-editable', ''); e.setAttribute('spellcheck', 'false'); e.contentEditable = editMode ? 'true' : 'false'; });
  }, [idx, key]);

  useEffect(() => {
    elsRef.current.forEach(e => { e.contentEditable = editMode ? 'true' : 'false'; });
    if (!editMode && document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }, [editMode]);

  // PDF export: render every slide (light theme, with any saved edits applied), then open the print dialog.
  useLayoutEffect(() => {
    if (!printing || !printRef.current) return;
    [...printRef.current.children].forEach((slideEl, si) => {
      const els = collectEditable(slideEl);
      const orig = els.map(e => e.innerHTML);
      (editsRef.current[si] || []).forEach(({ i, from, to }) => { if (els[i] && orig[i] === from) els[i].innerHTML = to; });
    });
  }, [printing]);
  useEffect(() => {
    if (!printing) return;
    const after = () => setPrinting(false);
    window.addEventListener('afterprint', after);
    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      await new Promise(r => setTimeout(r, 500));
      window.print();
    })();
    return () => window.removeEventListener('afterprint', after);
  }, [printing]);

  const recordEdits = () => {
    const list = [];
    elsRef.current.forEach((e, i) => { if (e.innerHTML !== origRef.current[i]) list.push({ i, from: origRef.current[i], to: e.innerHTML }); });
    if (list.length) editsRef.current[idx] = list; else delete editsRef.current[idx];
    persistEdits(editsRef.current);
    setEditCount(countEdits(editsRef.current));
  };
  const onKeyDown = (e) => {
    if (!e.target.isContentEditable) return;
    if (e.key === 'Enter') { e.preventDefault(); if (e.shiftKey) document.execCommand('insertLineBreak'); else e.target.blur(); }
    else if (e.key === 'Escape') { e.target.blur(); }
  };
  const onPaste = (e) => {
    if (!e.target.isContentEditable) return;
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
  };
  const resetSlide = () => {
    elsRef.current.forEach((e, i) => { e.innerHTML = origRef.current[i]; });
    delete editsRef.current[idx]; persistEdits(editsRef.current); setEditCount(countEdits(editsRef.current));
  };
  const resetAll = () => {
    if (!window.confirm('Discard every edit on every slide?')) return;
    editsRef.current = {}; try { localStorage.removeItem(LS_KEY); } catch (e) {}
    setEditCount(0); setKey(k => k + 1);
  };
  const downloadEdits = () => saveFile(JSON.stringify({ stamp: BAKED.stamp || 0, edits: editsRef.current }, null, 1), 'rep-fitness-edits.json', 'application/json');
  const loadEditsFile = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { const j = JSON.parse(r.result); editsRef.current = j.edits || j; persistEdits(editsRef.current); setEditCount(countEdits(editsRef.current)); setKey(k => k + 1); }
      catch (err) { window.alert('That file is not a valid edits file.'); }
    };
    r.readAsText(f); e.target.value = '';
  };
  const downloadDeck = async () => {
    try {
      const res = await fetch(location.href.split('#')[0]);
      if (!res.ok) throw new Error('fetch failed');
      const src = await res.text();
      const payload = JSON.stringify({ stamp: Date.now(), edits: editsRef.current }).replace(/</g, '\\u003c');
      const out = src.replace(/(<script id="deck-edits" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + payload + b);
      saveFile(out, 'rep-fitness-apr-sep-2026.html', 'text/html');
    } catch (err) {
      window.alert('"Download deck" only works when the deck is opened from a web address (for example the published site). Use "Download edits" instead, and "Load edits" on another copy.');
    }
  };

  const C = SLIDES[idx];
  const tbtn = 'px-3 py-1.5 rounded-md text-[12px] font-heading font-semibold tracking-wide whitespace-nowrap bg-white/10 hover:bg-gaf-orange text-white transition-colors';
  return (
    <ThemeCtx.Provider value={th}>
      {editMode && (
        <div data-noedit className="screen-only fixed top-2 left-1/2 -translate-x-1/2 z-[100] flex items-center gap-2 bg-gaf-black/95 text-white rounded-lg px-3 py-2 shadow-xl">
          <Pencil size={14} className="text-gaf-orange" />
          <span className="text-[12px] font-body mr-1 whitespace-nowrap">Edit mode · click text to edit · {editCount} change{editCount === 1 ? '' : 's'}</span>
          <button className={tbtn} onClick={resetSlide}>Reset slide</button>
          <button className={tbtn} onClick={resetAll}>Reset all</button>
          <button className={tbtn} onClick={() => setPrinting(true)}>Export PDF</button>
          <button className={tbtn} onClick={downloadDeck}>Download deck</button>
          <button className={tbtn} onClick={downloadEdits}>Download edits</button>
          <button className={tbtn} onClick={() => fileRef.current && fileRef.current.click()}>Load edits</button>
          <button className="px-3 py-1.5 rounded-md text-[12px] font-heading font-bold whitespace-nowrap bg-gaf-orange text-white" onClick={() => setEditMode(false)}>Done</button>
          <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={loadEditsFile} />
        </div>
      )}
      <div className="screen-only w-screen h-screen overflow-hidden flex items-center justify-center" style={{background: th.bodyBg}}>
        <div key={key} ref={stageRef} onInput={recordEdits} onKeyDown={onKeyDown} onPaste={onPaste} className="overflow-hidden slide-enter rounded-lg shrink-0" style={{width: 1600, height: 900, zoom, boxShadow: dark ? '0 0 80px rgba(0,0,0,.6)' : '0 4px 60px rgba(0,0,0,.12)'}}>
          <C n={idx + 1} t={SLIDES.length} />
          {/* Nav + theme toggle */}
          <div data-noedit className="absolute bottom-6 right-8 flex gap-2 z-50">
            <button onClick={() => setPrinting(true)} title="Export PDF (P)"
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}>
              <Download size={14} />
            </button>
            <button onClick={() => setEditMode(m => !m)} title="Click-to-edit mode (E)"
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${editMode ? 'bg-gaf-orange border-gaf-orange text-white' : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
              <Pencil size={14} />
            </button>
            <button onClick={() => setDark(d => !d)} title="Toggle theme (D)"
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}>
              {dark ? <Sun size={14} /> : <Moon size={14} />}
            </button>
            <div className="w-px h-9 bg-gaf-orange/20"></div>
            <button onClick={() => go(-1)} disabled={idx===0}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===0 ? th.navDisabled : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
              <ChevL size={16} />
            </button>
            <button onClick={() => go(1)} disabled={idx===SLIDES.length-1}
              className={`w-9 h-9 rounded-full flex items-center justify-center transition-all border ${idx===SLIDES.length-1 ? th.navDisabled : `${th.navBg} ${th.navBorder} ${th.navText} ${th.navHover}`}`}>
              <ChevR size={16} />
            </button>
          </div>
        </div>
      </div>
      {printing && (
        <div className="print-root" ref={printRef}>
          <ThemeCtx.Provider value={themes.light}>
            {SLIDES.map((S, i) => <div key={i} className="print-slide"><S n={i + 1} t={SLIDES.length} /></div>)}
          </ThemeCtx.Provider>
        </div>
      )}
    </ThemeCtx.Provider>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
