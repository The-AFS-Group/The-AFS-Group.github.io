<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Today's Check-ins</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --navy:#0E2A44; --offwhite:#EDEAE3; --orange:#F26422; --grey:#424242; --line:#D5D1C8; --white:#fff; --error:#B3261E; }
* { box-sizing: border-box; }
body { margin:0; background:var(--offwhite); color:var(--navy); font-family:Lato,Tahoma,sans-serif; font-size:16px; }
header { background:var(--navy); color:var(--white); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
header h1 { margin:0; font-family:Archivo,Tahoma,sans-serif; font-size:20px; }
header .meta { font-size:14px; opacity:.8; }
button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 16px; font-weight:700; background:var(--orange); color:var(--white); }
button.ghost { background:transparent; border:1px solid rgba(255,255,255,.5); }
main { max-width:1100px; margin:0 auto; padding:18px 16px 60px; }
.login { max-width:320px; margin:12vh auto; text-align:center; }
.login input { width:100%; height:52px; font-size:22px; text-align:center; border:2px solid var(--line); border-radius:12px; margin:14px 0; letter-spacing:.3em; }
.err { color:var(--error); font-weight:700; min-height:22px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
.stat { background:var(--white); border-radius:14px; padding:14px 16px; }
.stat b { display:block; font-family:Archivo,Tahoma,sans-serif; font-size:30px; }
.stat span { color:var(--grey); font-size:14px; }
table { width:100%; border-collapse:collapse; background:var(--white); border-radius:14px; overflow:hidden; }
th, td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--grey); background:#F7F5F0; }
td.time { white-space:nowrap; color:var(--grey); }
.flag { display:inline-block; background:#FDE7D9; color:#9A3C0A; border-radius:8px; padding:1px 8px; font-size:12px; margin-top:4px; }
.empty { text-align:center; color:var(--grey); padding:40px 0; }
.wrap { overflow-x:auto; }
</style>
</head>
<body>
<div id="login" class="login">
  <h2 style="font-family:Archivo,Tahoma,sans-serif">Staff view</h2>
  <div>Enter the staff PIN</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <div class="err" id="err"></div>
  <button id="go">View today</button>
</div>
<div id="app" hidden>
  <header>
    <div><h1>Today's check-ins</h1><div class="meta" id="meta"></div></div>
    <div><button class="ghost" id="refresh">Refresh</button> <button class="ghost" id="lock">Lock</button></div>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="wrap"><table><thead><tr><th>Time</th><th>Customer</th><th>Shopping for</th><th>Contact</th><th>Heard via</th></tr></thead><tbody id="rows"></tbody></table></div>
  </main>
</div>
<script src="config.js"></script>
<script>
(function () {
  var CFG = window.SHOWROOM_CONFIG || {};
  var $ = function (i) { return document.getElementById(i); };
  var KEY = 'showroom-staff-pin';
  var store = new URLSearchParams(location.search).get('store') || '';
  var timer;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function load(pin, fromLogin) {
    if (!CFG.ENDPOINT) { $('err').textContent = 'Not connected yet: set ENDPOINT in config.js'; return; }
    var u = CFG.ENDPOINT + '?action=today&pin=' + encodeURIComponent(pin) + (store ? '&store=' + encodeURIComponent(store) : '');
    fetch(u).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) {
        sessionStorage.removeItem(KEY); showLogin();
        $('err').textContent = j.error === 'bad_pin' ? 'Wrong PIN' : 'Something went wrong';
        return;
      }
      sessionStorage.setItem(KEY, pin);
      render(j);
    }).catch(function () { $('err').textContent = fromLogin ? 'Could not reach the sheet. Check wifi.' : ''; $('meta').textContent = 'Offline: showing last load'; });
  }

  function render(j) {
    $('login').hidden = true; $('app').hidden = false;
    var rows = j.rows || [], counts = {};
    rows.forEach(function (r) { counts[r.brand] = (counts[r.brand] || 0) + 1; });
    $('meta').textContent = j.date + (store ? ' · ' + store : '') + ' · updated ' + new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    var stats = '<div class="stat"><b>' + rows.length + '</b><span>Total today</span></div>';
    ['Gym and Fitness', 'Revel Saunas', 'WaterRower / Nohrd', 'NordicTrack + iFIT'].forEach(function (b) {
      stats += '<div class="stat"><b>' + (counts[b] || 0) + '</b><span>' + esc(b) + '</span></div>';
    });
    $('stats').innerHTML = stats;
    $('rows').innerHTML = rows.length ? rows.map(function (r) {
      var heard = esc(r.heard) + (r.heardOther ? ' <span style="color:#424242">– ' + esc(r.heardOther) + '</span>' : '');
      var flags = r.flags ? '<div><span class="flag">' + esc(r.flags) + '</span></div>' : '';
      return '<tr><td class="time">' + esc(r.time) + '</td><td><b>' + esc(r.name) + '</b>' + flags + '</td><td>' + esc(r.brand) +
        '</td><td>' + esc(r.email) + (r.email && r.phone ? '<br>' : '') + esc(r.phone) + '</td><td>' + heard + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="empty">No check-ins yet today.</td></tr>';
  }

  function showLogin() { clearInterval(timer); $('app').hidden = true; $('login').hidden = false; $('pin').value = ''; }

  $('go').addEventListener('click', function () { $('err').textContent = ''; load($('pin').value.trim(), true); });
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
  $('refresh').addEventListener('click', function () { load(sessionStorage.getItem(KEY) || ''); });
  $('lock').addEventListener('click', function () { sessionStorage.removeItem(KEY); showLogin(); });

  var saved = sessionStorage.getItem(KEY);
  if (saved) { load(saved); }
  timer = setInterval(function () { var p = sessionStorage.getItem(KEY); if (p && !$('app').hidden) load(p); }, 60000);
})();
</script>
</body>
</html>
